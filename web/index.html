<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->

  <meta charset="UTF-8">

  <meta name="theme-color" content="#00695C">
  <meta name="color-scheme" content="light dark">
  <!-- Dark Reader and similar extensions otherwise invert this page; the
       splash has explicit light and dark palettes instead. -->
  <meta name="darkreader-lock">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Chipbook</title>
  <link rel="manifest" href="manifest.json">

  <!--
    The splash paints before Flutter or CanvasKit has loaded. It uses the same
    surface as the app, light or dark, so the hand-off to the first frame is a
    fade, not a flash. The icon is embedded so the mark appears with the first
    paint. Colours follow the Material schemes in lib/theme.dart; the name and
    tagline match lib/app_info.dart.
  -->
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background-color: #F4FBF8;
      color-scheme: light dark;
    }

    .splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(90% 70% at 50% 24%, #FFFFFF 0%, #F4FBF8 52%, #E8F4EF 100%);
      color: #004C45;
      text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 500ms ease, visibility 500ms ease;
    }

    .splash.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash__content {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 24rem;
      padding: 24px;
      transition: transform 500ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .splash.is-hidden .splash__content {
      transform: translateY(-6px);
    }

    .splash__icon {
      display: block;
      width: 96px;
      height: 96px;
      border-radius: 24px;
      box-shadow:
        0 18px 34px rgba(0, 77, 68, 0.18),
        0 2px 6px rgba(0, 77, 68, 0.1);
      animation: splash-pop 700ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .splash__name {
      margin: 22px 0 0;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #004C45;
      animation: splash-rise 700ms cubic-bezier(0.2, 0.8, 0.2, 1) 80ms both;
    }

    .splash__tagline {
      margin: 8px 0 0;
      font-size: 14px;
      line-height: 1.4;
      color: #4D6A64;
      animation: splash-rise 700ms cubic-bezier(0.2, 0.8, 0.2, 1) 160ms both;
    }

    .splash__track {
      position: relative;
      width: 176px;
      height: 4px;
      margin-top: 28px;
      overflow: hidden;
      border-radius: 999px;
      background-color: rgba(0, 105, 92, 0.12);
      animation: splash-rise 700ms cubic-bezier(0.2, 0.8, 0.2, 1) 240ms both;
    }

    .splash__bar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 42%;
      border-radius: 999px;
      background: linear-gradient(90deg, #4DB6AC 0%, #00695C 50%, #4DB6AC 100%);
      animation: splash-sweep 1.7s cubic-bezier(0.55, 0, 0.45, 1) infinite;
    }

    .splash__status {
      margin: 12px 0 0;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6B8A83;
      animation: splash-rise 700ms cubic-bezier(0.2, 0.8, 0.2, 1) 320ms both;
    }

    /* Match the dark Material scheme surface and accents, so the hand-off to
       a dark Flutter frame does not flash a light splash. */
    html[data-theme="dark"],
    html[data-theme="dark"] body {
      background-color: #111315;
    }

    html[data-theme="dark"] .splash {
      background:
        radial-gradient(90% 70% at 50% 24%, #191C1E 0%, #111315 52%, #0B0D0F 100%);
      color: #E5E7E7;
    }

    html[data-theme="dark"] .splash__icon {
      box-shadow:
        0 0 42px rgba(130, 213, 200, 0.3),
        0 18px 34px rgba(0, 0, 0, 0.55),
        0 2px 6px rgba(0, 0, 0, 0.35);
    }

    html[data-theme="dark"] .splash__name {
      color: #E5E7E7;
    }

    html[data-theme="dark"] .splash__tagline,
    html[data-theme="dark"] .splash__status {
      color: #B6BABA;
    }

    html[data-theme="dark"] .splash__track {
      background-color: rgba(229, 231, 231, 0.12);
    }

    html[data-theme="dark"] .splash__bar {
      background: linear-gradient(90deg, #5AA79B 0%, #82D5C8 50%, #5AA79B 100%);
    }

    @keyframes splash-pop {
      0% { opacity: 0; transform: scale(0.86); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes splash-rise {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes splash-sweep {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(300%); }
    }

    @keyframes splash-pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    /*
      Reduced motion keeps the layout still but lets the progress bar fade in
      and out, so the screen never looks frozen while the bundle downloads.
    */
    @media (prefers-reduced-motion: reduce) {
      .splash__icon,
      .splash__name,
      .splash__tagline,
      .splash__track,
      .splash__status {
        animation: none;
      }

      .splash__content {
        transition: none;
      }

      .splash.is-hidden .splash__content {
        transform: none;
      }

      .splash__bar {
        width: 100%;
        animation: splash-pulse 1.9s ease-in-out infinite;
      }
    }
  </style>

  <script>
    // Choose the same appearance Flutter will use before the first paint.
    // shared_preferences stores the string JSON-encoded under this key.
    (function () {
      var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      try {
        var stored = JSON.parse(window.localStorage.getItem('theme_preference'));
        if (stored === 'dark') {
          dark = true;
        } else if (stored === 'light') {
          dark = false;
        }
      } catch (error) {
        // No saved choice or unreadable storage: follow the system.
      }
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      var themeColor = document.querySelector('meta[name="theme-color"]');
      if (themeColor) {
        themeColor.setAttribute('content', dark ? '#111315' : '#00695C');
      }
    })();
  </script>
</head>

  <script>
    (function () {
      var splash = document.getElementById('splash');
      if (!splash) {
        return;
      }

      function remove() {
        if (splash.parentNode) {
          splash.parentNode.removeChild(splash);
        }
      }

      function hide() {
        if (splash.classList.contains('is-hidden')) {
          return;
        }

        // Always cross-fade. Opacity is safe under reduced motion, and the
        // content transform is disabled there.
        splash.classList.add('is-hidden');
        splash.addEventListener('transitionend', remove, { once: true });
        // transitionend does not fire when the tab is in the background.
        setTimeout(remove, 750);
      }

      window.addEventListener('flutter-first-frame', hide, { once: true });
    })();
  </script>
