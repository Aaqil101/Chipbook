name: Deploy web

on:
  push:
    branches: [master]
    # Only a change that can reach the web bundle is worth a production
    # deployment. Everything else is verified by ci.yml instead.
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [preview, production]
        default: preview

# Never run two deploys of the same target at once; queue the newer one.
concurrency:
  group: deploy-web-${{ inputs.target || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.50.0
  VERCEL_CLI_VERSION: 65.16.0

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      TARGET: ${{ inputs.target || 'production' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # A missing secret still produces a build, so catch it here instead of
      # shipping an app that only shows the missing-configuration screen.
      - name: Check the required secrets
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # CI checks the same tree, but a deploy must never ship something that
      # fails its own checks; a manual dispatch never runs CI at all.
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Vercel's build image has no Flutter SDK, so the bundle is built here and
      # uploaded as a prebuilt deployment. The Supabase values are compiled into
      # the bundle, so a changed value needs a new deployment, not a rebuild.
      # The app lives under /app/ so the site root can be a static landing page.
      - name: Build web
        run: |
          flutter build web --release \
            --base-href /app/ \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      # The root is real HTML and CSS; the Flutter bundle moves to /app/. The
      # pages that Google and the README point at stay at the root, and the
      # root's flutter_service_worker.js is a kill switch for the pre-split
      # worker that was registered at scope "/".
      - name: Lay out the site
        run: |
          set -euo pipefail
          test -f build/web/index.html || {
            echo "::error::No web build output at build/web"
            exit 1
          }
          for page in landing.html privacy.html about.html favicon.png site.css site.js retire-service-worker.js icons/Icon-192.png; do
            test -f "build/web/$page" || {
              echo "::error::web/$page is missing from the bundle"
              exit 1
            }
          done
          mkdir -p build/site/app
          find build/web -mindepth 1 -maxdepth 1 -exec mv {} build/site/app/ \;
          cp build/site/app/landing.html build/site/index.html
          cp build/site/app/privacy.html build/site/privacy.html
          cp build/site/app/about.html build/site/about.html
          cp build/site/app/favicon.png build/site/favicon.png
          # The header and footer use the app icon, which lives in the bundle.
          cp build/site/app/icons/Icon-192.png build/site/chipbook-icon.png
          cp build/site/app/site.css build/site/site.css
          cp build/site/app/site.js build/site/site.js
          cp build/site/app/retire-service-worker.js build/site/flutter_service_worker.js

      - name: Install Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      # Fails loudly when the token, org ID, or project ID is wrong, before
      # anything is deployed.
      - name: Link the Vercel project
        run: vercel pull --yes --environment="$TARGET"

      - name: Stage the build output
        run: |
          test -f build/site/index.html || {
            echo "::error::No site output at build/site"
            exit 1
          }
          mkdir -p .vercel/output/static
          cp -R build/site/. .vercel/output/static/
          printf '{"version":3}\n' > .vercel/output/config.json

      - name: Deploy
        id: deploy
        run: |
          args=(--prebuilt --yes)
          if [ "$TARGET" = "production" ]; then
            args+=(--prod)
          fi
          output="$(vercel deploy "${args[@]}")"
          printf '%s\n' "$output"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' | tail -n 1)"
          if [ -n "$url" ]; then
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "Deployed $url to $TARGET." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Deployment finished but no URL was found in the output"
          fi

      - name: Report the deployment
        run: 'echo "$TARGET: ${{ steps.deploy.outputs.url }}"'
